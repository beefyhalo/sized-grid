name: CI

on:
  push:
    branches: [master]
  pull_request:
  # The documented escape hatch for the benchmark gate. An intended slowdown
  # (or an intended speedup past --fail-if-faster) makes the `bench` job red
  # and keeps it red, because a failing run deliberately does not record a new
  # baseline. Dispatch this workflow on master with `refresh-baseline` set to
  # record the current numbers as the new normal instead of gating against the
  # old ones. That is the only way the baseline moves without a green run, and
  # it leaves an audit trail in the Actions log saying who moved it.
  workflow_dispatch:
    inputs:
      refresh-baseline:
        description: Record a new benchmark baseline instead of gating against the cached one
        type: boolean
        default: false

# sized-grid-3e9. Without this, every push queues a brand-new run rather than
# cancelling the one it supersedes -- a burst of pushes (several worktree
# merges in a short window) backs up shared-runner capacity for hours, with
# older, already-stale runs holding slots newer ones are waiting on. Grouping
# on github.ref keeps master's queue separate from each pull request's: a
# push to master only cancels an earlier in-flight master run, and a PR only
# cancels that same PR's own earlier run. A cancelled master run never wrote
# its benchmark baseline (gated on success), which is fine -- the commit it
# would have recorded is already superseded.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # hlint + ormolu over the whole tree, from the flake's `preCommit` check
  # (flake.nix) -- the same definition that installs the git pre-commit hook
  # in `nix develop`, so local and CI cannot disagree. Its own job rather than
  # a step in flake-check: it shares nothing with the GHC builds, closes in
  # seconds against the public cache (no cache-nix-action needed -- hlint,
  # ormolu and pre-commit are all in cache.nixos.org), and a formatting nit
  # should not wait on two GHC toolchains to report.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - run: nix build --print-build-logs .#checks.x86_64-linux.preCommit

  flake-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      # Caches the nix store (ghc912/ghc914 closures) across runs, keyed on
      # flake.lock. gc-max-store-size keeps the store under GitHub's 10 GB
      # per-repo cache limit -- the full closure is multi-GB, so an unbounded
      # cache would thrash.
      #
      # sized-grid-se6: `nix store gc --max N` treats N as bytes to free, not
      # a target store size, so cache-nix-action computes and passes it
      # correctly -- the value here really is "keep the store at or under
      # 6G". The bug was that the store this GC ran against also held the
      # `devShells` closure (haskell-language-server, ormolu, hlint,
      # stylish-haskell, ...), which `nix flake check` below used to build.
      # That closure is unrelated to what this job checks and, alongside two
      # GHC toolchains, pushed the pre-GC store past 10G -- so a plain
      # mark-and-sweep GC to fit under 6G had no reason to spare GHC over
      # anything else, and it didn't. Restricting the build below to just the
      # `checks` derivations keeps HLS out of the store entirely, so 6G is
      # comfortably enough for both GHC closures rather than a tight squeeze
      # that gets whichever paths GC visits first.
      #
      # sized-grid-pr6: pinned to v27/v6 since this job's introduction, both
      # several majors behind (current v31/v7 as of 2026-08-19). Every run
      # observed on v6 fails to restore with tar errors against /nix/store --
      # 'Cannot open: Permission denied' on an existing .drv, 'Cannot utime'
      # and 'Cannot change mode' on the store directory itself -- so the
      # cache never actually helps and flake-check pays a full rebuild every
      # time. Not reproduced locally (this is a GH-runner-only failure mode:
      # install-nix-action's multi-user install leaves /nix/store root-owned,
      # and tar as the unprivileged runner user can't restore permission bits
      # on paths it doesn't own). Bumping both actions to current majors is
      # the first thing to try; watch the next run rather than assuming this
      # landed it.
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock', 'flake.nix') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 6G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never
      # Builds grid-sized -- library + its own tests + haddock -- on
      # ghc912/ghc914 (see flake.nix's `checks`). grid-sized only:
      # deliberately not the gloss/GLUT examples, and not atlas-topology or
      # grid-atlas either, neither of which the library depends on. Those two
      # are built and tested by the cabal matrix job below.
      - run: nix build --print-build-logs .#checks.x86_64-linux.ghc912 .#checks.x86_64-linux.ghc914
      # `nix flake check` also builds `devShells.<system>.default/ghc914`
      # (see flake.nix) to verify they're valid derivations, which pulls the
      # whole haskell-language-server toolchain into the store for no benefit
      # here -- this job never enters a devShell. --no-build keeps that
      # verification to evaluation only -- run *after* the build above so
      # that `callCabal2nix`'s import-from-derivation (in `packages` and
      # `checks`, which devShells also reference) is already realized;
      # --no-build refuses to realize it itself and fails outright if the
      # checks build hasn't already put it in the store.
      - run: nix flake check --no-build --print-build-logs

  cabal:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Kept in sync with the `tested-with` field in grid-sized.cabal.
        # GHC 9.6/9.8 are not supported: RequiredTypeArguments, which the
        # API uses throughout, arrived in GHC 9.10.
        ghc: ["9.10.1", "9.12.3", "9.14.1"]
    steps:
      - uses: actions/checkout@v4

      # gameOfLife and ising-example depend on gloss, which pulls in
      # OpenGLRaw/GLURaw/OpenGL/GLUT. Without these, GLUT fails to configure
      # and `cabal build all` fails outright, taking the library build down
      # with it.
      - name: Install GLUT/OpenGL system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libglu1-mesa-dev freeglut3-dev

      - uses: haskell-actions/setup@v2
        id: setup-haskell
        with:
          ghc-version: ${{ matrix.ghc }}
          cabal-version: latest

      - uses: actions/cache@v4
        with:
          path: |
            ${{ steps.setup-haskell.outputs.cabal-store }}
            dist-newstyle
          key: ${{ runner.os }}-ghc${{ matrix.ghc }}-${{ hashFiles('**/*.cabal', 'cabal.project') }}
          restore-keys: |
            ${{ runner.os }}-ghc${{ matrix.ghc }}-

      - run: cabal update

      # `cabal build all` alone does not build test-suites or benchmarks, so
      # the tests, readme and bench targets need these flags to be caught by
      # this job. Keeps the bounds in every .cabal file honest across the
      # supported GHC range, and is the only job that compiles the benchmarks
      # on more than one compiler.
      #
      # -Werror is baked into every package's ghc-options (not passed here),
      # so any file this job actually recompiles fails the build on a new
      # warning -- this doesn't depend on dist-newstyle being cold, since GHC
      # only needs to be compiling the file to enforce it (sized-grid-ior).
      - run: cabal build all --enable-tests --enable-benchmarks

      # sized-grid-svil. This step used to be absent, and the comment above
      # used to say the suites were "exercised by nix flake check" -- but
      # flake.nix's `checks` are `callCabal2nix "grid-sized" src`, which is
      # the root package alone, and grid-sized does not depend on grid-atlas.
      # So atlas-topology's and grid-atlas's suites were built by this job and
      # run by neither: 21 tests that had never executed in CI, including the
      # vertex-cycle law that sized-grid-5gm7 turned out to be a real defect
      # in. Running them here rather than adding them to the flake covers
      # every package on all three compilers instead of the flake's two, and
      # needs no second copy of the plugin overrides.
      #
      # The flags are repeated from the build step, and have to be
      # (sized-grid-r74b): without them `cabal test all` re-solves, and the
      # solver -- free to drop test suites rather than backtrack for them --
      # picks a plan that has none, then reports [Cabal-7043] "the solver
      # picked a plan that does not include the test suites". Passing the same
      # flags forces the suites in and lands on the plan the step above already
      # built, so this costs the run time of the suites and nothing else.
      - run: cabal test all --enable-tests --enable-benchmarks --test-show-details=direct

  # sized-grid-adr.11. This library's performance is a property of what GHC
  # does with the source, not of the source itself: the wins recorded in
  # `IsCoordList` depend on folds unrolling and methods inlining, and a fold
  # stops unrolling for reasons invisible in a diff. Building the benchmarks,
  # which the matrix job above already does, notices none of that. This job
  # runs them and compares.
  #
  # The baseline is CI's own, not the `bench/baseline-*.csv` in the tree. That
  # file is aarch64-darwin timings from a laptop, and a GitHub runner is
  # neither that architecture nor that machine; gating against it would need a
  # threshold so loose it would catch nothing. Instead every green run on
  # master saves its CSV to the Actions cache and every pull request restores
  # it, so the comparison is this runner class against itself. Caches written
  # on the default branch are readable from branches based on it, which is what
  # makes the master -> PR direction work. See bench/README.md.
  bench:
    # Pinned rather than `ubuntu-latest`, unlike the jobs above: this one
    # compares timings against timings, so the runner image is part of the
    # measurement and a silent image rollover would read as a regression across
    # the whole suite at once.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # One GHC, not the matrix: a baseline is per-compiler, and three of them
      # would triple the runtime to gate the same code three times. 9.12.3 is
      # the middle of the supported range and the version the checked-in
      # baseline was recorded on.
      #
      # No GLUT/OpenGL apt step, unlike the matrix job: those are needed to
      # *configure* gameOfLife and ising-example, and a single-component
      # benchmark target never configures them. The solver still reads the
      # whole cabal.project, but resolving a package is not building it.
      - uses: haskell-actions/setup@v2
        id: setup-haskell
        with:
          ghc-version: "9.12.3"
          cabal-version: latest

      - uses: actions/cache@v4
        with:
          path: |
            ${{ steps.setup-haskell.outputs.cabal-store }}
            dist-newstyle
          key: bench-${{ runner.os }}-ghc9.12.3-${{ hashFiles('**/*.cabal', 'cabal.project') }}
          restore-keys: |
            bench-${{ runner.os }}-ghc9.12.3-

      # Keyed by run id rather than commit sha so a re-run, or a manual
      # refresh of the same commit, writes a new entry -- cache keys are
      # immutable, so a sha-keyed save would silently no-op the second time.
      # The restore-keys prefix then picks the most recently created match,
      # which is the newest baseline master recorded.
      - name: Restore benchmark baseline
        uses: actions/cache/restore@v4
        with:
          path: bench-baseline.csv
          key: bench-baseline-ghc9.12.3-ubuntu-24.04-${{ github.run_id }}
          restore-keys: |
            bench-baseline-ghc9.12.3-ubuntu-24.04-

      - run: cabal update

      # 25% is deliberately loose: the recorded `2*Stdev` column is 5-10% on
      # most of these, a shared runner is worse than a laptop, and a gate
      # tighter than the noise is a gate that gets switched off within a month.
      # Tighten it once there is a run history showing what this runner's
      # spread actually is. tasty-bench absorbs some of the noise on its own --
      # it reports "same as baseline" whenever the difference is inside
      # max(2*stdev, the baseline's own 2*stdev) -- so the threshold only has
      # to cover what is left.
      #
      # --fail-if-faster is set far wider, and note that its scale is not the
      # other one's: tasty-bench turns it into a lower bound of
      # `1 - percent/100` on the new/old ratio, so 90 means "fail below 0.1x",
      # i.e. more than ten times faster, and any value >= 100 is a lower bound
      # below zero -- an option that can never fire. Ten times is the point of
      # it: a genuine optimisation should not have to fight the gate, but a
      # benchmark that got *orders* faster usually means it stopped doing work
      # -- an argument floated out of the loop, a result no longer forced --
      # and that is a bug these numbers would otherwise report as a triumph.
      #
      # A benchmark absent from the baseline compares as "same", so adding one
      # never fails the gate; it starts being watched from the next master run.
      - name: Run benchmarks
        run: |
          set -euo pipefail
          opts="--csv bench-results.csv"
          if [ "${{ inputs.refresh-baseline }}" = "true" ]; then
            echo "::notice::refresh-baseline requested -- recording numbers without gating."
          elif [ -f bench-baseline.csv ]; then
            opts="$opts --baseline bench-baseline.csv --fail-if-slower 25 --fail-if-faster 90"
          else
            echo "::notice::No cached baseline for this runner and GHC -- recording one instead of gating."
          fi
          cabal bench grid-sized:bench:benchmarks --benchmark-options="$opts"

      # `always()`, so a run that failed the gate still hands over the numbers
      # that failed it, rather than only the percentages in the log.
      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-results-ghc9.12.3-ubuntu-24.04
          path: bench-results.csv
          if-no-files-found: warn

      # Only from master, and only from a run that passed the gate: a
      # regression must not install itself as the new normal just by being
      # merged. Pull requests read the baseline and never write it, which also
      # stops one PR's numbers from becoming every other PR's baseline.
      - name: Promote results to baseline
        if: success() && github.ref == 'refs/heads/master'
        run: cp -f bench-results.csv bench-baseline.csv

      - name: Save benchmark baseline
        if: success() && github.ref == 'refs/heads/master'
        uses: actions/cache/save@v4
        with:
          path: bench-baseline.csv
          key: bench-baseline-ghc9.12.3-ubuntu-24.04-${{ github.run_id }}
