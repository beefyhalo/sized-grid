name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  flake-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      # Caches the nix store (ghc912/ghc914 closures) across runs, keyed on
      # flake.lock. gc-max-store-size keeps the store under GitHub's 10 GB
      # per-repo cache limit -- the full closure is multi-GB, so an unbounded
      # cache would thrash.
      - uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock', 'flake.nix') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 6G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never
      # Builds the library + tests + haddock on ghc912 (see flake.nix's
      # `checks`). Deliberately does not cover the gloss/GLUT examples --
      # see the cabal matrix job below.
      - run: nix flake check --print-build-logs

  cabal:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Kept in sync with the `tested-with` field in grid-sized.cabal.
        # GHC 9.6/9.8 are not supported: RequiredTypeArguments, which the
        # API uses throughout, arrived in GHC 9.10.
        ghc: ["9.10.1", "9.12.3", "9.14.1"]
    steps:
      - uses: actions/checkout@v4

      # gameOfLife and ising-example depend on gloss, which pulls in
      # OpenGLRaw/GLURaw/OpenGL/GLUT. Without these, GLUT fails to configure
      # and `cabal build all` fails outright, taking the library build down
      # with it.
      - name: Install GLUT/OpenGL system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libglu1-mesa-dev freeglut3-dev

      - uses: haskell-actions/setup@v2
        id: setup-haskell
        with:
          ghc-version: ${{ matrix.ghc }}
          cabal-version: latest

      - uses: actions/cache@v4
        with:
          path: |
            ${{ steps.setup-haskell.outputs.cabal-store }}
            dist-newstyle
          key: ${{ runner.os }}-ghc${{ matrix.ghc }}-${{ hashFiles('**/*.cabal', 'cabal.project') }}
          restore-keys: |
            ${{ runner.os }}-ghc${{ matrix.ghc }}-

      - run: cabal update

      # `cabal build all` alone does not build test-suites or benchmarks, so
      # the tests, readme and bench targets need these flags to be caught by
      # this job. This matrix builds only -- it exists to keep the bounds in
      # grid-sized.cabal honest across the supported GHC range; the tasty
      # suite itself is exercised by `nix flake check` above on ghc912/ghc914.
      #
      # -Werror is baked into every package's ghc-options (not passed here),
      # so any file this job actually recompiles fails the build on a new
      # warning -- this doesn't depend on dist-newstyle being cold, since GHC
      # only needs to be compiling the file to enforce it (sized-grid-ior).
      - run: cabal build all --enable-tests --enable-benchmarks
