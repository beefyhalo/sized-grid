# worktrunk project config — https://worktrunk.dev/hook/
#
# Lifecycle hooks for `wt` worktrees. pre-* hooks block (failure aborts the op);
# post-* run in the background with output logged. A project hook prompts for
# approval on first run (cached in ~/.config/worktrunk/approvals.toml); pass
# `wt --yes` when driving it non-interactively.

# Before the worktree is handed off: whitelist direnv so `.envrc` (`use flake`,
# already tracked so it's present in the new tree) loads the dev shell — GHC,
# cabal, HLS, and the git-hooks.nix pre-commit install — on the first cd into it.
# pre-start (blocking), not post-start: wt-claude opens the herdr pane and starts
# the agent as soon as `wt switch` returns, so a backgrounded `direnv allow` races
# the pane's shell — it sees `.envrc` still blocked and caches that until a manual
# `direnv allow`. Blocking here lands the allow first.
pre-start = "direnv allow {{ worktree_path }}"

# Optional: pre-build so an agent landing in the worktree isn't blocked on a cold
# `cabal build`. Heavy for this many packages — uncomment if you want it.
# [[post-start]]
# warm = "cd {{ worktree_path }} && nix develop --command cabal build all"
